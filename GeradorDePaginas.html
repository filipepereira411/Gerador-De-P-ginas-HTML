<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Meu Fazedor HTML de Raiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: #1e1e2e; color: #cdd6f4; }
        header { background-color: #11111b; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #313244; }
        h1 { font-size: 1.2rem; color: #89b4fa; }
        .toolbar { display: flex; gap: 10px; }
        button { background-color: #45475a; color: #cdd6f4; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 6px; font-size: 0.9rem; transition: 0.2s; }
        button:hover { background-color: #89b4fa; color: #11111b; }
        .btn-download { background-color: #a6e3a1; color: #11111b; font-weight: bold; }
        .btn-download:hover { background-color: #94e2d5; }
        .container { display: flex; flex: 1; overflow: hidden; }
        .pane { width: 50%; display: flex; flex-direction: column; height: 100%; position: relative; }
        .pane-title { background-color: #181825; padding: 8px 15px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #a6adc8; border-bottom: 1px solid #313244; }
        textarea { flex: 1; width: 100%; height: 100%; border: none; background-color: #1e1e2e; color: #cdd6f4; font-family: 'Consolas', 'Fira Code', monospace; font-size: 1rem; padding: 15px; resize: none; outline: none; line-height: 1.5; }
        iframe { flex: 1; border: none; background-color: #ffffff; }
        #divider { width: 4px; background-color: #313244; cursor: col-resize; }
    </style>
</head>
<body>

    <header>
        <h1>🔨 Fazedor HTML v1.0</h1>
        <div class="toolbar">
            <button onclick="insertCode('heading')">➕ Título</button>
            <button onclick="insertCode('paragraph')">➕ Parágrafo</button>
            <button onclick="insertCode('button')">➕ Botão Alegre</button>
            <button onclick="insertCode('card')">➕ Bloco (Card)</button>
            <button class="btn-download" onclick="downloadHTML()">💾 Descarregar Ficheiro</button>
        </div>
    </header>

    <div class="container">
        <!-- Painel de Código -->
        <div class="pane">
            <div class="pane-title">Código-Fonte (Edite aqui)</div>
            <textarea id="editor" spellcheck="false" oninput="updatePreview()"><!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>A minha página</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #f4f7f6; }
        h1 { color: #4a4a4a; }
        .content { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="content">
        <h1>Olá! Bem-vindo ao teu site 🚀</h1>
        <p>Edita o código à esquerda para veres a magia acontecer à direita.</p>
    </div>
</body>
</html></textarea>
        </div>

        <div id="divider"></div>

        <!-- Painel de Visualização -->
        <div class="pane">
            <div class="pane-title">Visualização em Tempo Real (Live Preview)</div>
            <iframe id="preview"></iframe>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');

        // Atualiza a visualização do iframe
        function updatePreview() {
            const code = editor.value;
            const previewDoc = preview.contentDocument || preview.contentWindow.document;
            previewDoc.open();
            previewDoc.write(code);
            previewDoc.close();
        }

        // Insere blocos de código pré-fabricados na posição do cursor
        function insertCode(type) {
            let snippets = {
                heading: '\n    <h1>Novo Título Estilizado</h1>',
                paragraph: '\n    <p>Este é um novo parágrafo de texto adicionado automaticamente.</p>',
                button: '\n    <button style="background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Clique Aqui!</button>',
                card: '\n    <div style="border: 1px solid #ddd; padding: 15px; margin: 15px 0; border-radius: 8px; background: #fff;">\n        <h3>Título do Card</h3>\n        <p>Conteúdo interno estruturado.</p>\n    </div>'
            };

            const startPos = editor.selectionStart;
            const endPos = editor.selectionEnd;
            const text = editor.value;
            
            // Adiciona o snippet antes de fechar o body se encontrar a tag, senão insere no fim
            const insertText = snippets[type] || '';
            editor.value = text.substring(0, startPos) + insertText + text.substring(endPos);
            
            editor.focus();
            updatePreview();
        }

        // Cria e faz o download automático do ficheiro .html
        function downloadHTML() {
            const code = editor.value;
            const blob = new Blob([code], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'pagina_gerada.html';
            link.click();
        }

        // Inicializar a visualização ao carregar a página
        window.onload = updatePreview;
    </script>
</body>
</html>
